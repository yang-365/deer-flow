# Transfer Workflow Parameter Schema
# These parameters should be extracted from conversation by the LLM.
# Authentication and session parameters are handled automatically via passthrough.

workflow_name: transfer

parameters:
  - name: payee_name
    type: string
    required: true
    description: Name of the transfer recipient

  - name: payee_account
    type: string
    required: true
    description: Bank account number of the recipient

  - name: amount
    type: number
    required: true
    description: Transfer amount (must be positive)
    validation:
      min: 0.01
      max: 50000

  - name: currency
    type: string
    required: false
    default: CNY
    description: Currency code (e.g., CNY, USD)

  - name: remark
    type: string
    required: false
    description: Transfer memo or remark (optional)
