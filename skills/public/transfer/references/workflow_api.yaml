# Transfer Workflow API Configuration
# This file defines how to call the external workflow platform for transfers.

# Full endpoint URL for the transfer workflow.
# The agent reads this and passes it to call_workflow(endpoint=...).
endpoint: https://workflow-platform.example.com/api/v1/workflows/transfer
method: POST

# Request body structure (merged with passthrough_params automatically):
request_body:
  payee_name: "{{payee_name}}"
  payee_account: "{{payee_account}}"
  amount: "{{amount}}"
  currency: "{{currency}}"
  remark: "{{remark}}"

# Expected response structure:
response:
  success_field: success
  data_field: data
  error_field: error
  # Example success response:
  # {
  #   "success": true,
  #   "data": {
  #     "transaction_id": "TXN20260101001",
  #     "status": "completed",
  #     "timestamp": "2026-01-01T12:00:00Z"
  #   }
  # }
