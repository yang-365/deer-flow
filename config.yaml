# DeerFlow Configuration - Banking Assistant Mode

config_version: 8

log_level: info

token_usage:
  enabled: false

models:
  - name: qwen3.6-plus
    display_name: Qwen3.6 Plus (DashScope)
    use: langchain_openai:ChatOpenAI
    model: qwen3.6-plus
    api_key: $DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 4096
    temperature: 0.7

  - name: qwen3.6-flash
    display_name: Qwen3.6 Flash (DashScope)
    use: langchain_openai:ChatOpenAI
    model: qwen3.6-flash-2026-04-16
    api_key: $DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 4096
    temperature: 0.7

tool_groups:
  - name: web
  - name: file:read
  - name: file:write

tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5

  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

tool_search:
  enabled: false

uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

skills:
  container_path: /mnt/skills

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

summarization:
  enabled: true
  model_name: null
  trigger:
    - type: tokens
      value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
    - read_file
    - read
    - view
